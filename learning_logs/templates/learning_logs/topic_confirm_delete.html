{% extends 'learning_logs/base.html' %}

{% block content %}
  <h2>Delete Topic</h2>
  <p>Are you sure you want to delete the topic: <strong>{{ topic }}</strong>?</p>
  
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'learning_logs:topics' %}">Cancel</a>
  </form>
{% endblock %}
